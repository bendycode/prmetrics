# Autonomy dials for the dependabot-batch skill.
# Edit these to tune how much the skill does without asking.
# Possible values for merge/deploy/flake dials: auto, ask
#
# The skill reads this file at the start of each run.

# Auto-merge dev-only gems (gems only in :development or :development, :test groups)
# for patch and minor bumps with green CI. Majors always ask (hard veto, see SKILL.md).
merge_dev_only_with_green_ci: auto

# Auto-merge runtime gems for patch and minor bumps with green CI.
# Majors, Ruby, Rails, and anything on the never-auto list always ask.
merge_runtime_bumps: auto

# Deploy to production after a clean-green main post-batch.
# bin/deploy handles its own failure detection (health check, crash detection).
deploy_after_batch: auto

# If CI failures match known flake fingerprints, open a separate flake-fix PR first.
separate_flake_fix_pr: auto

# Minimum Dependabot compatibility score, as an integer percent, or off. With a
# number, a pull request below it or with no score goes to a person whatever the
# merge dials above say.
compatibility_score_floor: off

deploy_command: bin/deploy

# Prints the commit production is serving. A deploy is confirmed against it.
live_commit_command: bin/live-commit
