version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    ignore:
      # Rails major version upgrades are intentional, multi-step projects.
      # Handle them via a dedicated upgrade PR, not a routine dependabot bump.
      - dependency-name: "rails"
        update-types: ["version-update:semver-major"]
      # web-console 4.3 requires railties >= 8.0, so Dependabot answers a
      # web-console bump by also moving Rails to 8.x. Lift this with the
      # Rails 8 upgrade.
      - dependency-name: "web-console"
        versions: [">= 4.3"]
      # Action Cable 7.2's redis adapter accepts redis >= 4 and < 6, and
      # config/cable.yml names that adapter for production. Rails 8.1.4 is
      # the first release whose adapter accepts redis 6. Lift this once the
      # app runs a Rails release that does.
      - dependency-name: "redis"
        versions: [">= 6"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
